[package]
name = "reel"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
dirs = "5"

# libc is used for PPID lookup via getppid() on Unix (Linux, macOS, BSD).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# windows-sys is used for PPID lookup via CreateToolhelp32Snapshot.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
