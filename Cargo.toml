[package]
name = "reel"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "A stateful CLI HTTP client that persists request state across invocations"
license = "MIT"
authors = ["Michal Chwirut"]
repository = "https://github.com/MickCh/reel"
homepage = "https://github.com/MickCh/reel"
readme = "README.md"
keywords = ["http", "cli", "curl", "rest", "client"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "reel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON object keys in the order they were received /
# written, instead of serde_json's default alphabetical BTreeMap ordering —
# pretty-printed response bodies and merged request bodies keep their
# original field order.
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13", features = ["blocking"] }
dirs = "6"
# url is already in the tree via reqwest; used directly for cookie scoping
# (host/path extraction from the request URL).
url = "2"
# uuid is used by the ${{ uuid() }} template function (idempotency keys etc.).
uuid = { version = "1", features = ["v4"] }

# libc is used for PPID lookup via getppid() and process liveness via
# kill(pid, 0) on Unix (Linux, macOS, BSD).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# windows-sys is used for PPID lookup via CreateToolhelp32Snapshot and for
# process start time / liveness via OpenProcess + GetProcessTimes.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
