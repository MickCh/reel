[package]
name = "reel"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A stateful CLI HTTP client that persists request state across invocations"
license = "MIT"
authors = ["Michal Chwirut"]
repository = "https://github.com/MickCh/reel"
homepage = "https://github.com/MickCh/reel"
readme = "README.md"
keywords = ["http", "cli", "curl", "rest", "client"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "reel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking"] }
dirs = "6"

# libc is used for PPID lookup via getppid() on Unix (Linux, macOS, BSD).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# windows-sys is used for PPID lookup via CreateToolhelp32Snapshot.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
